<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon is served standalone, so CSS custom properties do NOT resolve here:
       the accent must stay a literal hex, kept in sync with --primary by hand. -->
  <rect width="32" height="32" rx="8" fill="#7A2E3A"/>
  <text x="16" y="23" font-family="Arial Black, sans-serif" font-size="18" font-weight="900"
        fill="#F3EEE8" text-anchor="middle" letter-spacing="-0.5">P</text>
</svg>
